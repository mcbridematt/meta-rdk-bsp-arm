name: Trigger GitLab pipeline

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      contains(fromJSON('[
        "rdkcentral/meta-rdk-bsp-arm",
        "mcbridematt/meta-rdk-bsp-arm"
      ]'), github.repository)
    steps:
      # Try to avoid writing the push token onto disk (via .git/config)
      - name: Create askpass helper script
        run: |
          echo '#!/bin/sh' > /tmp/git-askpass.sh
          echo 'printf "%s" "$GIT_TOKEN"' >> /tmp/git-askpass.sh
          chmod +x /tmp/git-askpass.sh

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Run GitLab pipeline
        timeout-minutes: 300
        id: pipelinevars
        env:
          GIT_ASKPASS: /tmp/git-askpass.sh
          GIT_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN_CREDS }}
        run: |
          git remote add gitlabcom https://glpat@gitlab.com/traversetech/rdk/meta-rdk-bsp-arm.git
          export MIRROR_REFERENCE="refs/heads/${GITHUB_REPOSITORY_OWNER}/${GITHUB_BASE_REF}/${GITHUB_ACTOR}/pull/${{ github.event.number }}"
          echo "Mirror repository reference will be ${MIRROR_REFERENCE}"
          git push --force gitlabcom "HEAD:${MIRROR_REFERENCE}"
          MIRROR_REPOSITORY_REFERENCE="${MIRROR_REFERENCE#refs/heads/}"

          curl --request POST \
          --form token=${{ secrets.GITLAB_PIPELINE_SECRET }} \
          --form ref="${MIRROR_REPOSITORY_REFERENCE}" \
          -o new_pipeline.json \
          "https://${{ vars.GITLAB_SERVER }}/api/v4/projects/${{ vars.GITLAB_PROJECT_ID }}/trigger/pipeline"
          NEW_PIPELINE_ID=$(cat new_pipeline.json | jq .id)
          echo "Created pipeline ID: ${NEW_PIPELINE_ID}"
          PIPELINE_WEB_URL=$(cat new_pipeline.json | jq -r ".web_url")
          echo "GitLab CI URL: ${PIPELINE_WEB_URL}"

          max_polls=150 # 150 * 120s ~= 5h
          polls=0
          while true; do
            if ! (curl --fail --silent --show-error \
              -o pipelinestatus.json \
              -H "PRIVATE-TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN_CREDS }}" \
              "https://${{ vars.GITLAB_SERVER }}/api/v4/projects/${{ vars.GITLAB_PROJECT_ID }}/pipelines/${NEW_PIPELINE_ID}"); then
              echo "ERROR: Failed to query pipeline status"
              exit 1
            fi
            CURRENT_PIPELINE_STATUS=$(cat pipelinestatus.json | jq -r .status)
            if [ "${CURRENT_PIPELINE_STATUS}" = "running" ] || [ "${CURRENT_PIPELINE_STATUS}" = "pending" ] || [ "${CURRENT_PIPELINE_STATUS}" = "created" ] ; then
              echo "Current pipeline status: ${CURRENT_PIPELINE_STATUS}"
              polls=$((polls + 1))
              if [ "${polls}" -ge "${max_polls}" ]; then
                echo "ERROR: Timed out waiting for pipeline to finish"
                exit 1
              fi
              sleep 120
              continue
            elif [ "${CURRENT_PIPELINE_STATUS}" = "success" ]; then
              echo "Pipeline successful"
              break
            elif [ "${CURRENT_PIPELINE_STATUS}" = "failed" ]; then
              echo "ERROR: Pipeline failed"
              exit 1
            else
              echo "ERROR: Unrecognized status ${CURRENT_PIPELINE_STATUS}"
              exit 1
            fi
          done
          # Get the test VM log
          curl -o pipelinejobs.json -H "PRIVATE-TOKEN: ${{secrets.GITLAB_PUSH_TOKEN_CREDS}}" "https://${{ vars.GITLAB_SERVER }}/api/v4/projects/${{ vars.GITLAB_PROJECT_ID }}/pipelines/${NEW_PIPELINE_ID}/jobs" 1>/dev/null 2>&1
          NUM_PIPELINE_JOBS=$(cat pipelinejobs.json | jq length)
          for i in $(seq 1 "${NUM_PIPELINE_JOBS}"); do
            array_ref=$((i-1))
            job_info=$(cat pipelinejobs.json | jq ".[$array_ref]")
            job_name=$(echo "${job_info}" | jq -r ".name")
            job_id=$(echo "${job_info}" | jq -r ".id")
            echo "VM Test Job ID: ${job_id}"
            if [ "${job_name}" = "test_image:vm" ]; then
              curl -o testlog.txt -H "PRIVATE-TOKEN: ${{secrets.GITLAB_PUSH_TOKEN_CREDS}}" "https://${{ vars.GITLAB_SERVER }}/api/v4/projects/${{ vars.GITLAB_PROJECT_ID}}/jobs/${job_id}/trace" 1>/dev/null 2>&1
              cat testlog.txt
              break
            fi
          done
