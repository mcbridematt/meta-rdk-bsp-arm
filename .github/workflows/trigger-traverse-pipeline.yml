name: Trigger GitLab pipeline

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: traverse-pipeline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      contains(fromJSON('[
        "rdkcentral/meta-rdk-bsp-arm",
        "mcbridematt/meta-rdk-bsp-arm"
      ]'), github.repository)
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Run GitLab pipeline
        timeout-minutes: 300
        id: pipelinevars
        shell: bash
        run: |
          chmod +x .github/scripts/trigger-traverse-pipeline.sh
          ./.github/scripts/trigger-traverse-pipeline.sh
        env:
          GITLAB_SERVER: ${{ vars.GITLAB_SERVER }}
          GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.pull_request.base.repo.name }}
          GITHUB_PR_NUMBER: ${{ github.event.number }}
          GITHUB_PR_SHA: ${{ github.event.pull_request.head.sha }}
          NUDGE_HOOK_URL: ${{ vars.NUDGE_HOOK_URL }}


